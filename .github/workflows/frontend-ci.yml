name: 🐳 Frontend - Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'services/frontend/opentax/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/frontend/opentax/**'

jobs:
        
  docker-build-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set Docker image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "FRONTEND_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/opentax-frontend:$SHORT_SHA" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_LATEST=${{ secrets.DOCKER_HUB_USERNAME }}/opentax-frontend:latest" >> $GITHUB_ENV

      - name: Build & Push Frontend
        run: |
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }} \
            -t $FRONTEND_IMAGE \
            -t $FRONTEND_IMAGE_LATEST \
            -f services/frontend/opentax/frontend.dockerfile \
            services/frontend/opentax \
            --push
