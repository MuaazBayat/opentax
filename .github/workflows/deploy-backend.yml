name: ☁️ Deploy Backend to Cloud Run

env:
  TAG: ${{ github.event.release.tag_name || 'release-test' }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/evvaluate-backend:${{ github.event.release.tag_name || 'release-test' }}

on:
  release:
    types: [published]  # Trigger when a GitHub release is published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push Backend Docker images
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $BACKEND_IMAGE \
            -f services/backend/backend.dockerfile \
            services/backend/.
          docker push $BACKEND_IMAGE

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy backend Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'opentax-backend'
          image: ${{ env.BACKEND_IMAGE }}
          flags: '--allow-unauthenticated --port=8000 --update-env-vars=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},DATABASE_URL=${{ secrets.DATABASE_URL}},DEBUG=True'
          container_port: 8000

      - name: Show Output
        run: |
          echo "Deployment finished!"
          echo "Backend deployed at:"
          echo "${{ steps.deploy-backend.outputs.url }}"