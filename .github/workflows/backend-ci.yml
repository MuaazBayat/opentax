name: 🐳 Backend - Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'services/backend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/backend/**'

jobs:
  docker-build-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set Docker image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "BACKEND_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/opentax-backend:$SHORT_SHA" >> $GITHUB_ENV
          echo "BACKEND_IMAGE_LATEST=${{ secrets.DOCKER_HUB_USERNAME }}/opentax-backend:latest" >> $GITHUB_ENV

      - name: Build & Push Backend
        run: |
          docker buildx build --no-cache \
            --platform linux/amd64 \
            -t $BACKEND_IMAGE \
            -t $BACKEND_IMAGE_LATEST \
            -f services/backend/backend.dockerfile \
            services/backend \
            --push
